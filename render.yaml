# Example Render Blueprint — adjust service names/URLs after first deploy
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: fleet-gps-db
    plan: free
    databaseName: fleet_gps
    user: fleet

services:
  - type: web
    name: fleet-gps-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fleet-gps-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_VERSION
        value: "20"

  - type: web
    name: fleet-gps-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
