services:
  postgres:
    image: postgres:16-alpine
    container_name: fleet-gps-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet_gps
    ports:
      - "5434:5432"
    volumes:
      - fleet_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet_gps"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fleet_pg_data:
